# Release CI: configure, build, and test across all supported platforms and presets.
#
# To add a new platform or build configuration:
#   1. Add a CMake configure preset to CMakePresets.json.
#   2. Add a corresponding entry to the matrix.include list below.
#      - Set 'use_vcpkg: true' for any Windows preset that uses the windows-vcpkg base.
#
# Workflow triggers:
#   - Every push to master.
#   - Every pull request targeting master.

name: Release Debug Builds and Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Don't cancel other jobs when one fails — see all failures at once.
      matrix:
        include:
          # Linux
          - name: "Linux | GCC | Debug"
            os: ubuntu-latest
            preset: linux-gcc-debug

          - name: "Linux | Clang | Debug"
            os: ubuntu-latest
            preset: linux-clang-debug

          - name: "Linux | GCC | Release"
            os: ubuntu-latest
            preset: linux-gcc-release

          - name: "Linux | Clang | Release"
            os: ubuntu-latest
            preset: linux-clang-release

          # Windows
          - name: "Windows | MSVC x64 | Debug"
            os: windows-latest
            preset: x64-debug
            use_vcpkg: true

          - name: "Windows | MSVC x64 | Release"
            os: windows-latest
            preset: x64-release
            use_vcpkg: true

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Linux: install build tools and OpenSSL
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libssl-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev

      # Windows: activate MSVC compiler (required for cl.exe + Ninja)
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Cache the vcpkg tool + installed packages, then run lukka/run-vcpkg.
      - name: Cache vcpkg
        if: ${{ matrix.use_vcpkg == true }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-af752f21c9d79ba3df9cb0250ce2233933f58486-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-af752f21c9d79ba3df9cb0250ce2233933f58486-

      - name: Setup vcpkg
        if: ${{ matrix.use_vcpkg == true }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg # must match the cache path above
          vcpkgGitCommitId: af752f21c9d79ba3df9cb0250ce2233933f58486 # must match builtin-baseline in vcpkg.json
          runVcpkgInstall: true # no-op on cache hit; installs on first run or after key change

      # Cache FetchContent dependency sources and build artefacts (_deps/) between runs.
      # Key: OS + preset + hash of all files containing FetchContent declarations.
      # A version bump in CMakeLists.txt or examples/CMakeLists.txt busts the cache.
      # restore-keys provides a partial fallback so a near-miss still saves download time.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/out/build/${{ matrix.preset }}/_deps
          key: ${{ runner.os }}-deps-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'examples/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.preset }}-

      # Configure
      # cmake --preset reads binaryDir and all cacheVariables from CMakePresets.json.
      # VCPKG_ROOT is set by the lukka/run-vcpkg action on Windows runs.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Build
      # Targets the binaryDir defined by the preset (out/build/<preset-name>).
      - name: Build
        run: cmake --build "${{ github.workspace }}/out/build/${{ matrix.preset }}"

      # Test
      - name: Test
        run: >
          ctest
          --test-dir "${{ github.workspace }}/out/build/${{ matrix.preset }}"
          --output-on-failure
